# MILE 全局配置（与设计文档 §3.0/§8 一致）
seed: 42

base:
  name: dm05
  # ---- 基座接入方式 ----
  # http : 连 OpenDM 的 Flask 服务（POST /v1/infer）
  # local: 进程内直接加载权重，不启服务 —— 见 mile/base/dm05_local.py
  # 选 local 的理由不只是"少一个进程"：MILE 每个验证点都要 VLM patch tokens，
  # 而 /v1/infer 只返回动作，拿不到特征。进程内一次前向同时给出动作和特征。
  mode: local
  # OpenDM HTTP 推理服务地址（docker 启动后）
  server_url: "http://127.0.0.1:7891"
  # 官方推荐 JSON API；旧版 /process_frame multipart 接口将逐步淘汰
  api_path: "/v1/infer"
  # 本地模式（需要直接进入 OpenDM 容器取特征时）
  # 官方 RoboDojo 仿真微调权重（Dexmal 2026-08-26 发布，HF/ModelScope 均有，
  # 目录内必须含配套 norm_stats.json）——即榜单 24.90/19.34% 的那个 checkpoint
  checkpoint: "./checkpoints/DM05-MEM-Robodojo-Sim"
  feature_layer: -2          # VLM 倒数第二层
  vlm_dim: 2560
  num_patches: 256
  action_dim: 14             # ARX X5 双臂绝对关节位置
  # ✅ 已核对（2026-10-10，HF model card 原文）：
  #   "The model generates 14-dimensional absolute joint-position action chunks
  #    of length 50, and the RoboDojo evaluation adapter executes the first 25
  #    actions from each predicted chunk."
  # 所以 chunk_len=50 是对的。RoboDojo 训练入口 / deploy.yml 里的 25/25 是
  # cover_blocks 单任务 SFT entry 的设定，不适用于 DM05-MEM-Robodojo-Sim 通用权重。
  chunk_len: 50
  exec_horizon: 25           # 每个决策点实际执行的步数（WM 窗口必须与之相等）
  # MEM 检查点还需最多 20 帧头相机历史（1 FPS，episode 开头左侧补齐；
  # 要求服务以 --data-config.is-history 启动）
  history_frames: 20
  history_fps: 1
  # 相机顺序固定：头 / 左腕 / 右腕（按序映射到请求槽位 "1"/"2"/"3"，不可换序）
  image_keys: ["images_1", "images_2", "images_3"]
  # ---- 条件化档案：这些值取自 OpenDM 源码，不要再改成"想当然"的值 ----
  # opendm/dataset/robodojo.py 注册项 + XPolicyLab deploy.yml：
  #   robot_type=Aloha、speed="0.5"、fps=25、history_slots=20、model_max_length=1536
  # 传 None 表示"用数据集注册项里的默认值"，即上面这几个。
  robot_type: null           # 明确留空 → Aloha（官方注册项）
  control_mode: null         # 官方注册项里没有 control_mode，不要自己编
  speed: "0.5"               # 官方注册项 / deploy.yml = 0.5（原来是 0.1，错的）
  # ---- 进程内加载所需的路径（mode: local 才用）----
  # OpenDM 仓库根目录（要能 import opendm.*，且 exp_entry 相对它解析）
  opendm_root: "/path/to/opendm"
  # 官方 RoboDojo 入口文件，等价于 launcher 的 --exp
  exp_entry: "playground/dm05_mem_sft_robodojo_cover_blocks.py"
  # 进程内抓 VLM patch tokens 供世界模型用：复用候选采样那次前向的 hook 输出，
  # 零额外前向。默认开 —— 这正是选 mode: local 的核心理由（动作+特征一次前向）。
  # 若 W1 冒烟第 3 项发现 hook 抓到的位置数 < num_patches，再关掉走
  # prepare_latents.py 的离线路径。
  enable_features: true
  # 进程内加载参数（mode: local 时才用）
  dataset_name: robodojo_sim_cover_blocks   # 必须是在 OpenDM 里注册过的名字
  action_mode: absolute      # deploy.yml: model_action_mode = absolute
  add_state: true
  is_history: true           # MEM 检查点需要，且须与 max_history_images 配套
  max_history_images: 20     # OpenDM 默认是 5！不设成 20 会直接报错
  model_max_length: 1536     # deploy.yml 给的值（OpenDM 默认 1024）
  backend: default           # 只能是 default；fast(TensorRT+CUDA graph) 会让特征 hook 失效
  precision_policy: bf16_mixed
  num_diffusion_steps: 10    # 必须与服务/训练一致
  image_format: "JPEG"       # /v1/infer 图像走 base64
  image_quality: 95

world_model:
  d_model: 1024
  n_layers: 4
  n_heads: 16
  d_ff: 4096
  dropout: 0.1
  # WM 想象窗口 = 实际执行步数（base.exec_horizon），不是策略原生 chunk 50——
  # 这样想象终点 z_{t+25} 与执行后真实观测严格可比
  window: 25
  action_tokens: 4           # 25 步窗口压缩为 4 个 token（Conv1d k=7,s=6 自动适配）
  text_tokens: 4
  # 阶段描述模板，{task} 任务名、{i} 1-based 阶段序号。
  # prepare_latents.py 与线上 server 必须用同一模板，否则 text_emb 语义错位。
  stage_text_template: "{task}: stage {i}"
  n_ensemble: 3              # 不确定性集成头数
  mask_ratio: 0.2            # 输入 patch 掩码比例
  loss_weights:
    latent: 1.0
    cosine: 0.5
    value: 0.5

train:
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 256
  max_steps: 60000
  warmup_steps: 2000
  bf16: true
  log_every: 100
  ckpt_every: 5000
  out_dir: "./runs/wm_v1"
  data_dir: "./data/robodojo_demos_latents"

milestones:
  alpha: 0.333               # 运动学线索权重
  beta: 0.333                # 接触线索权重
  gamma: 0.334               # 视觉线索权重
  min_separation: 100        # 里程碑最小间隔（控制步）
  k_range: [3, 10]           # 每任务里程碑数量范围
  use_official_substeps: true  # v1：直接用 RoboDojo 官方子步骤边界

controller:
  num_candidates: 4          # C（scaling 曲线扫描 1/2/4/8）
  lam: 1.0                   # 进度分权重
  eta: 0.5                   # 不确定性权重
  tau_J: 0.65                # 兜底值；正式运行以保形校准 τ̂ 为准
  radius: 0.35               # 里程碑验证半径 r（保形校准中固定）
  patience: 2                # 连续偏离容忍次数 n
  max_pop: 2                 # 连续回退最多弹栈层数

conformal:
  alpha: 0.05                # 目标误接受率（覆盖率 ≥ 1−α−1/(n+1)）
  radius: 0.35               # 固定一次，不参与搜索
  calib_tasks: 8             # 只用这些任务拟合 τ̂
  min_calib_points: 200      # 标定 rollout 至少收集的 (J,d) 决策点数

self_improve:
  enabled: true
  episodes_per_round: 500    # 每轮部署局数 R
  distill_steps: 500         # 每轮价值头蒸馏步数
  distill_batch: 64
  distill_lr: 1.0e-4
  use_lora: false            # 变体开关：value-head-only vs +LoRA

eval:
  benchmark: robodojo
  episodes_per_task: 50      # 25 标准 + 25 随机
  # 恢复片段录制抽帧：每 N 个执行步抽一次 VLM 特征。
  # encode() 是一次完整模型前向，逐步录（stride=1）意味着每个决策点多 25 次前向。
  # 恢复片段只用于价值头蒸馏，抽帧不损害语义。1 = 逐步（最贵）。
  record_stride: 5
  calibration_tasks: 8       # 只在这 8 个任务上调参
  heldout_tasks: 34          # 其余任务零调参
  candidate_sweep: [1, 2, 4, 8]  # 计算量-成功率 scaling 曲线
